# -----------------------------------------------------------------------------
# Backend Deployment (Production Ready)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeroagent-backend
  labels:
    app: aeroagent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeroagent-backend
  template:
    metadata:
      labels:
        app: aeroagent-backend
    spec:
      containers:
        - name: aeroagent-backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          
          # 👈 THIS IS THE FIX. Explicitly map environmental variables from your secret
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_REGION
            - name: BEDROCK_MODEL_ID
              value: "amazon.nova-pro-v1:0" # 👈 Permanently locks in your correct Nova cross-region string
