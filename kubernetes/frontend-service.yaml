# -----------------------------------------------------------------------------
# Frontend Service (Production Ready)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
apiVersion: v1
kind: Service
metadata:
  name: aeroagent-frontend
  annotations:
    # 👈 These force AWS to build a stable, public production Network Load Balancer (NLB)
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: aeroagent-frontend
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80 # 👈 Maps cleanly to your Nginx container port
