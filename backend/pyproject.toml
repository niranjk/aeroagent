[project]
name = "AeroAgentBE"
version = "0.1.0"
description = "AeroAgent Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.37",
    "chromadb>=1.5.9",
    "docling>=2.107.0",
    "fastapi>=0.115.0",
    "jupyter>=1.1.1",
    "numpy>=2.5.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-multipart>=0.0.9",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
